[package]
name = "deps-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "cargo fv example: a crate whose real crates.io dependencies (serde + serde_derive, serde_json, regex, sha2, tiny-keccak, num-bigint, rand, hashbrown, indexmap, …) are compiled by the Lean backend too; build from the offline registry (`--offline`)"

# Versions pinned to ones in the offline registry (Cargo.lock is committed).
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
hashbrown = "=0.17.1"
itoa = "1"
memchr = "2"
sha2 = "=0.11.0"
hex = "0.4"
bitflags = "2"
num-traits = "0.2"
num-bigint = "=0.5.1"
indexmap = "=2.14.2"
tiny-keccak = { version = "=2.0.2", features = ["keccak", "sha3"] }

# Used by the tests only (still compiled for the target, so through the Lean backend).
[dev-dependencies]
smallvec = "=1.16.2"
ryu = "1"
byteorder = "=1.5.0"
base64 = "=0.22.1"
arrayvec = "=0.7.8"
rand = "=0.10.3"
crc32fast = "1"

# Not part of any enclosing workspace.
[workspace]
