[package]
name = "fv-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "cargo fv example: integer arithmetic, slices, enums, Option/Result, iterators, u128, dyn traits and panics, as unit tests and a small binary"

[dependencies]

# `cargo fv`: functions whose symbol or Rust path contains one of these keep cg_clif's code
# (the sret interop test needs both sides).
[package.metadata.fv]
skip = ["interop::cg_clif_"]

# Not part of any enclosing workspace.
[workspace]
