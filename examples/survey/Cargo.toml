# The nine crates of the Rust CLIF survey (scripts/rust-clif/corpus/*.rs, used in place) as a
# cargo workspace. Each crate's tests/values.rs checks the values in tests/expected.txt, which
# gen-expected.sh computes with rustc's LLVM backend (aarch64-unknown-linux-musl, under qemu).
[workspace]
resolver = "2"
members = [
    "a_arith",
    "b_slices",
    "c_structs_enums",
    "d_loops_iters",
    "e_option_result",
    "f_crypto",
    "g_u128",
    "h_dyn_generic",
    "i_alloc",
]
exclude = ["expect"]
