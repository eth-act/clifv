[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
cranelift-codegen = { version = "=0.136.1", features = ["all-arch"] }
cranelift-reader = "=0.136.1"
cranelift-interpreter = "=0.136.1"
cranelift-module = "=0.136.1"
cranelift-object = "=0.136.1"
cranelift-frontend = "=0.136.1"
cranelift-isle = "=0.136.1"
target-lexicon = "0.13"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
