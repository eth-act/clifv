name: FV Lean setup
description: >-
  Pinned Lean toolchain, swap, the shared Lake artifact cache, and the Lake outputs of the
  baseline build and of earlier full-gate jobs (lake cache unstage).
inputs:
  swap-gb:
    description: Swap file size in GB (0 keeps the runner's default swap; GitHub-hosted runners only)
    default: '0'
  base-run-id:
    description: Run whose `lake-full` artifact holds the baseline build ('' = none)
    default: ''
  stages:
    description: Artifact name pattern of this run's staged Lake outputs to unstage ('' = none)
    default: ''
runs:
  using: composite
  steps:
    - name: Swap
      if: inputs.swap-gb != '0' && runner.environment == 'github-hosted'
      shell: bash
      env:
        SWAP_GB: ${{ inputs.swap-gb }}
      run: |
        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        # /mnt is the runner's scratch disk; the root disk if /mnt lacks room
        dir=/mnt
        if (( $(df --output=avail -B1G /mnt | tail -n 1) < SWAP_GB + 4 )); then dir=/; fi
        sudo fallocate -l "${SWAP_GB}G" "$dir/fv-swapfile"
        sudo chmod 600 "$dir/fv-swapfile"
        sudo mkswap "$dir/fv-swapfile" > /dev/null
        sudo swapon "$dir/fv-swapfile"
        free -g
        nproc
    - name: Configure Lean and the Lake cache
      shell: bash
      run: |
        echo "$RUNNER_TOOL_CACHE/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
        {
          echo "LEAN_BIN_DIR=$RUNNER_TOOL_CACHE/lean-4.34.1-linux/bin"
          # same filesystem as the workspace: Lake hard-links cached outputs into .lake/build
          echo "LAKE_CACHE_DIR=$HOME/lake-cache"
          echo "LAKE_ARTIFACT_CACHE=true"
          echo "LAKE_RESTORE_ARTIFACTS=true"
          # scripts/memcap.sh: no cgroup scopes (one job per VM; swap must stay usable)
          echo "FV_MEMCAP_OFF=1"
          echo "LEAN_NUM_THREADS=2"
        } >> "$GITHUB_ENV"
        command -v /usr/bin/time > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq time; }
        # some FVTest modules read Cranelift's ISLE sources while they elaborate (FVTest.Isle.*)
        scripts/fetch-third-party.sh wasmtime
    - name: Cache Lean toolchain
      id: lean-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/lean-4.34.1-linux
        key: lean-4.34.1-linux-47bf4bbd78f70c2e
    - name: Install pinned Lean
      if: steps.lean-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        LEAN_ARCHIVE: ${{ runner.temp }}/lean.tar.zst
        LEAN_TOOL_CACHE: ${{ runner.tool_cache }}
      run: |
        curl --fail --location --retry 3 \
          https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst \
          --output "$LEAN_ARCHIVE"
        echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $LEAN_ARCHIVE" | sha256sum --check
        tar --zstd -xf "$LEAN_ARCHIVE" -C "$LEAN_TOOL_CACHE"
    - name: Download baseline build
      if: inputs.base-run-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: lake-full
        path: ${{ runner.temp }}/lake-stages/base
        run-id: ${{ inputs.base-run-id }}
        github-token: ${{ github.token }}
    - name: Download staged outputs
      if: inputs.stages != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.stages }}
        path: ${{ runner.temp }}/lake-stages
    - name: Unstage
      shell: bash
      env:
        STAGES: ${{ runner.temp }}/lake-stages
      run: |
        mkdir -p "$LAKE_CACHE_DIR" "$STAGES"
        # where shards staged differing copies of a module (Lean's output is not always
        # reproducible), keep the copy the most downstream work was built against
        python3 scripts/lake-unstage.py "$STAGES"
        echo "cache $(du -sh "$LAKE_CACHE_DIR" | cut -f1)"
        rm -rf "$STAGES"
