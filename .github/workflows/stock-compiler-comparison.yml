name: Stock compiler comparison

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Direct commits to main are measured too. They publish a job summary and
  # artifacts, not a PR comment.
  push:
    branches: [main]

permissions:
  contents: read

# A newer PR commit replaces an older PR measurement. Main pushes finish in order;
# GitHub keeps only the newest pending run.
concurrency:
  group: stock-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Build and compare
    runs-on: ubuntu-24.04
    # This job never builds Lean cold (#1018): it takes the Lake outputs of the four comparison
    # executables from a Full gate build (.github/workflows/full-gate.yml, artifact `lake-full`)
    # or from its own earlier runs, and builds only the modules that differ, scheduled within
    # the runner's memory. Until then a Lean source change meant a plain `lake build` of 841
    # Lake jobs on this runner (16 GB, no swap): since #955 it lost the runner twice at job
    # 634-635 and ran into the former 60-minute limit once, so no commit was measured.
    # The two long steps stop themselves and fail with a message (STOCK_LEAN_LIMIT_S,
    # STOCK_COMPARE_LIMIT_S); the job limit leaves 90 minutes above their sum for the rest
    # (downloads, swap, caches, uploads: 10 to 15 minutes). A job that reaches its limit is
    # cancelled, not failed; "Check lost matches" fails in that case too.
    timeout-minutes: 300
    # actions: read finds the Full gate build and the main baseline summary.
    permissions:
      actions: read
      contents: read
    env:
      FV_COMPARE_MEMCAP: '0'
      FV_COMPARE_PREBUILT: '1'
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Measured (#1020, run 43462386914): 293 of the executables' 418 modules built on this
      # runner in 31 minutes (the scheduler's 29.2 and the link; heaviest module 9.4 GB). The
      # limit is for a slow or swapping runner, not for the usual case.
      STOCK_LEAN_LIMIT_S: '9000'
      # 3.5 minutes with the Rust builds cached (run 43389851748); the Rust tools build cold
      # after a change to them.
      STOCK_COMPARE_LIMIT_S: '3600'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history: the baseline is the newest measured main commit that is an
          # ancestor of the tested commit.
          fetch-depth: 0
      - name: Test CI reporting
        run: |
          python3 -m unittest discover -s scripts -p 'test_stock_comparison_*.py' -v
          node --test .github/scripts/stock-comparison-comment.test.cjs
          # The nightly digest shares the comment script's measurement checks.
          node --test .github/scripts/stock-comparison-nightly.test.cjs
      # This workflow's own Lake outputs (a `lake cache stage` directory): the four executables
      # of a tree with the same Lean sources, else the newest earlier ones (Lake's cache is keyed
      # by each module's inputs, so older outputs are restored only where they still apply).
      - name: Restore own Lean outputs
        id: lean-stage
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lake-stages/own
          key: stock-lean-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'FV/**/*.lean', 'FVTest/**/*.lean') }}
          restore-keys: |
            stock-lean-partial-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'FV/**/*.lean', 'FVTest/**/*.lean') }}-
            stock-lean-
      - name: Find a Full gate build
        id: lean-build
        if: steps.lean-stage.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stock-comparison-lean-build.py --head "$CI_HEAD_SHA" --out target/ci-lean-build.json --github-output
      # Pinned Lean, swap, and both sets of Lake outputs unstaged into the Lake cache.
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '24'
          base-run-id: ${{ steps.lean-build.outputs.run }}
      - name: Lean executables
        id: lean
        run: .github/scripts/stock-comparison-lean.sh target/ci-lean "$RUNNER_TEMP/lake-stages/own"
      - name: Save own Lean outputs
        if: steps.lean.outputs.stage == 'full' && steps.lean-stage.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lake-stages/own
          key: ${{ steps.lean-stage.outputs.cache-primary-key }}
      # After a build that failed or ran out of time: the modules that did build, for the re-run.
      - name: Save partial Lean outputs
        if: always() && steps.lean.outputs.stage == 'partial'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lake-stages/own
          key: stock-lean-partial-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'FV/**/*.lean', 'FVTest/**/*.lean') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cache Rust builds and downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            tools/prejit-export/target
          key: stock-rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.*', 'rust/**/*.rs', 'rust/rust-toolchain.toml', 'tools/prejit-export/**/Cargo.*', 'tools/prejit-export/src/**', 'scripts/patches/prejit-export.patch', 'scripts/prejit-export-build.sh') }}
          restore-keys: stock-rust-${{ runner.os }}-
      - name: Find main baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stock-comparison-baseline.py --head "$CI_HEAD_SHA" --out target/ci-baseline.json
      - name: Generate artifacts and compare
        run: |
          # The measurement's conditions stay as they were: fv-lean's LEAN_NUM_THREADS is for
          # builds.
          rc=0
          env -u LEAN_NUM_THREADS timeout --signal=TERM --kill-after=60 "$STOCK_COMPARE_LIMIT_S" \
            python3 scripts/stock-comparison-ci.py --out target/ci-comparison --jobs 2 --baseline target/ci-baseline.json || rc=$?
          if (( rc == 124 || rc == 137 )); then
            echo "::error title=No stock-comparison result::the measurement did not finish within $(( STOCK_COMPARE_LIMIT_S / 60 )) minutes (Rust builds, validation and comparison; logs in the artifact stock-comparison-artifacts). Re-run this job."
          elif (( rc )); then
            echo "::error title=No stock-comparison result::the measurement failed (exit $rc): see this step's log and the artifact stock-comparison-artifacts."
          fi
          exit "$rc"
      - name: Write job summary
        run: node .github/scripts/stock-comparison-comment.cjs target/ci-comparison.ci-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comment data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stock-comparison-summary-${{ github.run_attempt }}
          path: target/ci-comparison.ci-summary.json
          archive: true
          # Main summaries are the baselines of later runs.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
          if-no-files-found: error
      - name: Pack artifacts and logs
        if: always()
        run: |
          files=()
          for path in target/ci-comparison target/ci-comparison.build-logs target/ci-comparison.ci-summary.json target/ci-lean target/ci-lean-build.json; do
            if [[ -e "$path" ]]; then files+=("$path"); fi
          done
          if (( ${#files[@]} )); then
            tar -czf target/stock-comparison-artifacts.tar.gz "${files[@]}"
          fi
      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stock-comparison-artifacts-${{ github.run_attempt }}
          path: target/stock-comparison-artifacts.tar.gz
          archive: true
          compression-level: 0
          retention-days: 7

  ratchet:
    name: Check lost matches
    needs: measure
    # Always: after a measurement that failed, ran out of time, lost its runner or was cancelled
    # (by hand, at the job's time limit, or because a newer commit of the pull request replaced
    # the run), this job fails with "no result". It used to be skipped, and a skipped check reads
    # as "nothing lost" (#1018). `!cancelled()` would still skip it at the job's time limit and
    # after a cancellation by hand; a replaced run belongs to an older commit, where a failed
    # check blocks nothing.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests: read reads the override label when this job runs.
    permissions:
      contents: read
      pull-requests: read
    env:
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Every attempt's summary: re-running only this job keeps the measurement's attempt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.measure.result == 'success'
        with:
          pattern: stock-comparison-summary-*
          path: report
      - name: Fail on lost matches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: python3 scripts/stock-comparison-ratchet.py report

  comment:
    name: Publish PR result
    needs: measure
    # Only with a measurement: this job is skipped after a failed one (the check that fails is
    # "Check lost matches").
    # Forks cannot obtain a write token here. The trusted workflow_run publisher
    # handles them after these workflows reach the default branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stock-comparison-summary-${{ github.run_attempt }}
          path: report
          skip-decompress: true
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/stock-comparison-comment.cjs').post({
              github, context, core
            });
