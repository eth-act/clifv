name: Full gate

# The full gate list of docs/TO-PROVE.md §7 ("Gate policy") on GitHub-hosted runners: every
# Lean target, crate-proofs, the axiom audits (scripts/audit/), float-spec, the run-time gates and
# cargo fv. Since 2026-11-11 this is the merge gate, so it runs every line of scripts/main-gate.sh
# (#998); a line added there is added here.
#
# The Lean build is split by scripts/ci-build-plan.py into up to three waves of parallel shards;
# Lake outputs move between jobs as `lake cache stage` directories (artifacts). The assembled
# build of a main commit (`lake-full`) is the baseline of later runs: only modules whose sources
# differ from the baseline commit, and their importers, are rebuilt. The modules that read other
# files while they elaborate are elaborated again on every run (scripts/elab-inputs.py, #1012).
on:
  push:
    branches: [main]
  schedule:
    # weekly from scratch (no baseline; Lake does not trace every input: the files FVTest.Isle
    # reads are covered by scripts/elab-inputs.py on every run, an input nobody has listed only
    # here), in its own concurrency group: a cold build takes most of a day here
    - cron: '17 1 * * 6'
  workflow_dispatch:
    inputs:
      fresh:
        description: Build everything (ignore the baseline build)
        type: boolean
        default: false
      base-run:
        description: Run id whose lake-full is the baseline (default, the newest of main or of this branch); for a branch stacked on another PR's head. Refused if a non-Lean build input differs from that run's commit
        type: string
        default: ''

permissions:
  contents: read

# Post-merge only (never a required check; authors merge on their per-PR gates, docs/TO-PROVE.md
# §7). One run per branch at a time: the newest pending push waits, older pending ones are dropped.
concurrency:
  group: full-gate-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: false

env:
  # the continuous main gate's tracking issue (docs/TO-PROVE.md §7)
  FULL_GATE_ISSUE: '261'
  LEAN_TARGETS: FV FVTest Corpus

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      base-run: ${{ steps.base.outputs.run }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
      wave3: ${{ steps.plan.outputs.wave3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find baseline build
        id: base
        if: github.event_name != 'schedule' && !inputs.fresh
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_BRANCH: ${{ github.ref_name }}
          BASE_RUN: ${{ inputs.base-run }}
        run: |
          # newest unexpired `lake-full` of a run on main or on this branch; Lake's cache is
          # content-addressed, so any baseline is safe: the planner rebuilds what differs from it.
          # `base-run` names another run's instead: a branch stacked on another PR's head takes
          # that PR's build, where its own first run would build the same modules again. The
          # planner then refuses a difference in a file modules read untraced (--explicit-base)
          if [[ -n $BASE_RUN ]]; then
            [[ $BASE_RUN =~ ^[0-9]+$ ]] || { echo "::error::base-run is not a run id: $BASE_RUN"; exit 1; }
            read -r run sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASE_RUN/artifacts?name=lake-full" \
              --jq '[.artifacts[] | select(.expired | not)] | last | "\(.workflow_run.id // "") \(.workflow_run.head_sha // "")"') || true
            [[ -n "${run:-}" ]] || { echo "::error::base-run: run $BASE_RUN has no unexpired lake-full artifact"; exit 1; }
          else
            read -r run sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lake-full&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not)
                     | select(.workflow_run.head_branch == "main" or .workflow_run.head_branch == env.OWN_BRANCH)]
                    | sort_by(.created_at) | last | "\(.workflow_run.id // "") \(.workflow_run.head_sha // "")"') || true
          fi
          if [[ -n "${sha:-}" ]] && ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            git fetch -q --depth 1 origin "$sha" || true
          fi
          if [[ -n "${run:-}" ]] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "baseline: run $run, commit $sha"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            # a partial build (some modules failed or a shard was lost) lists the modules it lacks
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" -n lake-full-missing -D base-missing 2>/dev/null; then
              echo "partial baseline: $(wc -w < base-missing/missing.txt) modules missing"
              echo "missing=base-missing/missing.txt" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n $BASE_RUN ]]; then
            echo "::error::base-run: the commit $sha of run $BASE_RUN cannot be fetched"
            exit 1
          else
            echo "no baseline build: planning everything"
          fi
      - name: Plan
        id: plan
        env:
          BASE: ${{ steps.base.outputs.sha }}
          MISSING: ${{ steps.base.outputs.missing }}
          # empty with `fresh` (no baseline step: everything is planned)
          EXPLICIT: ${{ steps.base.outputs.run && inputs.base-run }}
          # eth-act (free plan) runs at most 20 jobs at once across all its repositories
          SHARDS: ${{ vars.FULL_GATE_SHARDS || '10' }}
          # runner seconds per second recorded in scripts/lake-module-peaks.tsv (GitHub-hosted,
          # 3 lean processes per runner, measured on run 39074925471, 2026-10-18: 1.97, FV.Opt.Proof.*
          # 2.95, hence --prefix-scale 1.5) and the shard scheduler's limits
          TIME_SCALE: ${{ vars.FULL_GATE_TIME_SCALE || '2.0' }}
          RAM: ${{ vars.FULL_GATE_RAM || '15G' }}
          FV_CI_BUDGET: ${{ vars.FULL_GATE_BUDGET || '15G' }}
          FV_CI_HEAVY: ${{ vars.FULL_GATE_HEAVY || '12G' }}
          FV_CI_MAX_JOBS: ${{ vars.FULL_GATE_MAX_JOBS || '3' }}
        run: |
          # without pipefail tee's status hides the planner's refusal (and any other failure of it)
          set -o pipefail
          python3 scripts/ci-build-plan.py ${BASE:+--base "$BASE"} ${MISSING:+--missing "$MISSING"} \
            ${EXPLICIT:+--explicit-base} \
            --shards "$SHARDS" --waves 3 \
            --time-scale "$TIME_SCALE" --prefix-scale FV.Opt.Proof.=1.5 --ram "$RAM" \
            --budget "$FV_CI_BUDGET" --heavy "$FV_CI_HEAVY" --max-jobs "$FV_CI_MAX_JOBS" \
            --out ci-plan.json --github-output $LEAN_TARGETS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 7

  wave1:
    name: Build wave 1
    needs: plan
    if: needs.plan.outputs.wave1 != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.wave1) }}
    uses: ./.github/workflows/full-gate-shard.yml
    permissions:
      actions: read
      contents: read
    with:
      wave: 1
      shard: ${{ matrix.shard }}
      base-run: ${{ needs.plan.outputs.base-run }}
      stages: ''

  wave2:
    name: Build wave 2
    needs: [plan, wave1]
    # also after a failed shard: modules that do not need its failures still build, and any import
    # it lost is rebuilt here (lake-serial-build --only schedules imports that are out of date)
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave2 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.wave2) }}
    uses: ./.github/workflows/full-gate-shard.yml
    permissions:
      actions: read
      contents: read
    with:
      wave: 2
      shard: ${{ matrix.shard }}
      base-run: ${{ needs.plan.outputs.base-run }}
      stages: stage-w1-*

  wave3:
    name: Build wave 3
    needs: [plan, wave1, wave2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave3 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.wave3) }}
    uses: ./.github/workflows/full-gate-shard.yml
    permissions:
      actions: read
      contents: read
    with:
      wave: 3
      shard: ${{ matrix.shard }}
      base-run: ${{ needs.plan.outputs.base-run }}
      stages: stage-w[12]-*

  assemble:
    name: Assemble build and executables
    needs: [plan, wave1, wave2, wave3]
    # also after failed shards: what did build is published (a partial lake-full), so the next run
    # rebuilds only the missing modules and their importers; the job then fails and the gates skip
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(vars.FULL_GATE_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '24'
          base-run-id: ${{ needs.plan.outputs.base-run }}
          stages: stage-w*
      - name: Build every Lean target and executable
        id: build
        env:
          WAVES_OK: ${{ contains(fromJSON('["success","skipped"]'), needs.wave1.result) && contains(fromJSON('["success","skipped"]'), needs.wave2.result) && contains(fromJSON('["success","skipped"]'), needs.wave3.result) }}
        run: |
          mapfile -t exes < <(python3 -c 'import tomllib; print("\n".join(e["name"] for e in tomllib.load(open("lakefile.toml", "rb"))["lean_exe"]))')
          start=$(date +%s)
          complete=0
          if [[ $WAVES_OK == true ]]; then
            # anything a shard did not cover (none, if the plan is right) builds here
            if lake build $LEAN_TARGETS "${exes[@]}" -o full-outputs.jsonl > build.log 2>&1; then complete=1; fi
            tail -n 40 build.log
          fi
          echo "lake build: $(( $(date +%s) - start )) s"
          if (( ! complete )); then
            # a shard failed (its modules are not rebuilt here, on one runner) or the build did:
            # publish the modules that are up to date and list the ones that are not
            lake build --no-build $LEAN_TARGETS -o full-outputs.jsonl > no-build.log 2>&1 || true
            mkdir -p "$RUNNER_TEMP/lake-full-missing"
            sed -n 's/^✖ \[[0-9]*\/[0-9]*\] Building \([^ ]*\).*/\1/p' no-build.log | sort -u \
              > "$RUNNER_TEMP/lake-full-missing/missing.txt"
            echo "partial build: $(wc -l < "$RUNNER_TEMP/lake-full-missing/missing.txt") modules out of date (and their importers)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          lake cache stage full-outputs.jsonl "$RUNNER_TEMP/lake-full"
          echo "lake-full: $(du -sh "$RUNNER_TEMP/lake-full" | cut -f1), $(find "$RUNNER_TEMP/lake-full" -type f | wc -l) files"
          df -h /
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lake-full
          path: ${{ runner.temp }}/lake-full
          compression-level: 0
          # main builds are later runs' baselines
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outputs.complete != '1'
        with:
          name: lake-full-missing
          path: ${{ runner.temp }}/lake-full-missing/missing.txt
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
      - name: Fail on a partial build
        if: steps.build.outputs.complete != '1'
        run: |
          echo "::error::the build is incomplete; lake-full holds the modules that built (see the step summary)"
          exit 1

  audit:
    name: Axiom audits
    needs: [plan, assemble]
    # explicit: a skipped wave (nothing to build) would otherwise skip every job downstream
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '16'
          stages: lake-full
      - name: Audit
        run: |
          mkdir -p gate-logs
          # restore (from lake-full) every library the audit files import: `lake env lean` builds
          # nothing, and concurrency/floats-* import FVTest modules
          lake build $LEAN_TARGETS 2>&1 | tail -n 1
          set -o pipefail
          python3 scripts/axiom-audit.py --log-dir gate-logs | tee gate-logs/summary.txt
      - name: Elaboration-time inputs
        # #1012: some FVTest modules check themselves against files they read while they
        # elaborate (FVTest/Isle/oracle/*, corpus/clif/*, the pinned Wasmtime sources). Lake does
        # not trace those files, so every build with a baseline restores the old result of the
        # check, also when the planner plans the module. This line elaborates each of those
        # modules from its source (`lake lean`), on every run, against this tree's files; the
        # list is READERS in scripts/elab-inputs.py (scripts/test_elab_inputs.py keeps it complete).
        if: ${{ !cancelled() }}
        run: |
          mkdir -p gate-logs
          start=$(date +%s)
          rc=0
          python3 scripts/elab-inputs.py check --log-dir gate-logs/elab-inputs > gate-logs/elab-inputs.log 2>&1 || rc=$?
          cat gate-logs/elab-inputs.log
          echo "elab-inputs rc=$rc $(( $(date +%s) - start )) s: $(tail -n 1 gate-logs/elab-inputs.log)" | tee -a gate-logs/summary.txt
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-audit
          path: gate-logs
          retention-days: 14

  crate-proofs:
    name: crate-proofs
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ${{ fromJSON(vars.FULL_GATE_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '24'
          stages: lake-full
      - name: Build crate-proofs
        run: |
          mkdir -p gate-logs
          set -o pipefail
          lake build FV 2>&1 | tail -n 1
          start=$(date +%s)
          (cd crate-proofs && /usr/bin/time -v lake build) > gate-logs/crate-proofs.log 2>&1
          rc=$?
          echo "crate-proofs rc=$rc $(( $(date +%s) - start )) s: $(grep -E 'Build completed|error' gate-logs/crate-proofs.log | tail -n 3 | tr '\n' ' ')" | tee gate-logs/summary.txt
          grep -E 'Maximum resident|Elapsed' gate-logs/crate-proofs.log || true
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-crate-proofs
          path: gate-logs
          retention-days: 14

  e2e:
    name: lean-e2e-check
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ${{ fromJSON(vars.FULL_GATE_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '24'
          stages: lake-full
      - name: lean-e2e-check
        run: |
          mkdir -p gate-logs
          # link-check needs a `cargo fv link-proof` directory: the assemble job only builds it
          lake build lean-e2e-check 2>&1 | tail -n 1
          start=$(date +%s)
          rc=0; /usr/bin/time -v lake exe lean-e2e-check > gate-logs/e2e.log 2>&1 || rc=$?
          echo "lean-e2e-check rc=$rc $(( $(date +%s) - start )) s: $(grep -E 'accepted|rejected' gate-logs/e2e.log | tail -n 3 | tr '\n' ' ')" | tee -a gate-logs/summary.txt
          grep -E 'Maximum resident|Elapsed' gate-logs/e2e.log || true
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-e2e
          path: gate-logs
          retention-days: 14

  unused-imports:
    # report only: not in the report's GREEN rule, never fails the gate (fix: scripts/shake/regen.sh)
    name: Unused imports (report)
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.FULL_GATE_RUNNER || '"ubuntu-24.04"') }}
    # 28 min on a 16-vCPU orb (49 CPU-min, 12.7 GB peak)
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '24'
          stages: lake-full
      - name: scripts/shake --dry-run
        env:
          SHAKE_JOBS: '2'
        run: |
          mkdir -p gate-logs
          lake build $LEAN_TARGETS 2>&1 | tail -n 1
          start=$(date +%s)
          rc=0; python3 scripts/shake/shake.py --dry-run --no-pr-skip --report gate-logs/unused-imports.json \
            > gate-logs/unused-imports.log 2>&1 || rc=$?
          echo "unused imports (report only) rc=$rc $(( $(date +%s) - start )) s: $(grep '^modules ' gate-logs/unused-imports.log || tail -n 1 gate-logs/unused-imports.log)" \
            | tee -a gate-logs/summary.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-unused-imports
          path: gate-logs
          retention-days: 14

  runtime:
    name: ${{ matrix.gate }}
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gate: [lean-backend-filetests, lean-backend-encode-check, clif-filetests, opt-difftest, arm-fault-cosim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '16'
          stages: lake-full
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static llvm-18 clang
          rustup target add aarch64-unknown-linux-musl
      - name: Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: full-gate-rust-${{ matrix.gate }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/**/Cargo.lock') }}
      - name: Run
        env:
          GATE: ${{ matrix.gate }}
        run: |
          mkdir -p gate-logs
          start=$(date +%s)
          rc=0; "scripts/$GATE.sh" > "gate-logs/$GATE.log" 2>&1 || rc=$?
          line=$(grep -E 'TOTAL|total|corpus|runtest|differ|functions [0-9]+:|fail' "gate-logs/$GATE.log" | tail -n 4 | tr '\n' ' ' || true)
          if [[ $GATE == clif-filetests ]]; then
            # exits 1 on any failing run line; the gate is the recorded baseline
            cur=$(grep -E 'TOTAL files [0-9]+: pass' "gate-logs/$GATE.log" | tail -n 1 || true)
            n() { grep -oE "$1 [0-9]+" <<< "$cur" | head -n 1 | cut -d' ' -f2 || true; }
            p=$(n pass) f=$(n fail) d=$(n disagree)
            read -r bp bf bd < <(grep -v '^#' scripts/clif-filetests-baseline.txt)
            rc=1; [[ -n $p && $p -ge $bp && $f -le $bf && $d -le $bd ]] && rc=0
            line="pass $p fail $f disagree $d (baseline pass $bp fail $bf disagree $bd)"
          fi
          if [[ $GATE == arm-fault-cosim ]]; then
            # one TOTAL line with forms, vectors and faulting vectors above 0 and no failure
            # (9ae930c5 locally: 152 forms, 15,200 vectors, 10,318 faults)
            ok=0; line=$(python3 scripts/gate-line-check.py arm-fault-cosim "gate-logs/$GATE.log") || ok=$?
            if [[ $rc == 0 && $ok != 0 ]]; then rc=1; fi
          fi
          echo "$GATE rc=$rc $(( $(date +%s) - start )) s: $line" | tee gate-logs/summary.txt
          tail -n 15 "gate-logs/$GATE.log"
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-${{ matrix.gate }}
          path: gate-logs
          retention-days: 14

  cargo-fv:
    name: cargo fv${{ matrix.args && format(' {0}', matrix.args) }} (${{ matrix.example }})
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The cargo fv lines of scripts/main-gate.sh (#998). Every line is green only when its
        # executables pass the binary check (docs/contracts/e2e.md, "Binary level (M9)"), all of
        # them except exactly the issue-linked ones of scripts/gate-known-unverified.txt, and when
        # its counts (executables, Lean-compiled and verified functions) are the pinned ones of
        # scripts/gate-expected-counts.txt (#1004); the `--lean-link` lines also link with lean-ld.
        # `parity`: the crate-parity measurement below (AGENTS.md: fv-demo and survey).
        include:
          - { example: fv-demo, args: '--lean-link --verified', parity: true }
          - { example: survey, args: '--lean-link --verified', parity: true }
          # #691, #734: typed and Stock-lowered functions in one executable (20 dependencies).
          # Locally 27 min under a 12 GB cap (after #985); 2 h 08 min on a runner (#1010)
          - { example: deps, args: '--lean-link --verified', parity: false }
          # #479: a panic unwinding through a Lean-compiled frame larger than 32 KiB. Plain
          # `cargo fv`: the big function is outside the verified subset (--verified would keep
          # cg_clif's code), so its executable is outside the binary check: `0 of 1`, with its
          # entry in the known-unverified list (#1008, #1009)
          - { example: bigframe-unwind, args: '', parity: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '16'
          stages: lake-full
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static llvm-18
          rustup toolchain install nightly-2026-09-26 --profile minimal \
            --component rustc-dev --target aarch64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl
      - name: Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            target/cg_clif
          key: full-gate-rust-cargo-fv-${{ hashFiles('rust/rust-toolchain.toml', 'rust/**/Cargo.lock', 'scripts/build-cg-clif.sh', 'scripts/patches/cg-clif-extnames.patch') }}
      - name: Build cg_clif and cargo fv
        run: |
          scripts/build-cg-clif.sh
          (cd rust && cargo build --release -p cargo-fv -p clif-data-export -p lean-regalloc)
          # cargo fv's own check that a missing lean-link/lean-ld/link-check is an error (#1004)
          (cd rust && cargo test --release -p cargo-fv)
          # the five executables cargo fv runs (restored from the assembled build), all required
          # here. Until #1004 a missing link-check or lean-ld was no error for cargo fv: every
          # executable "not checked" (#998), every `--lean-link` link by rust-lld, status 0
          lake build lean-backend lean-link clif-decode link-check lean-ld 2>&1 | tail -n 1
          for t in lean-backend lean-link clif-decode link-check lean-ld; do test -x ".lake/build/bin/$t"; done
      - name: Fetch the example's dependencies
        # examples/deps builds offline from cargo's registry cache (its .cargo/config.toml), as on
        # a developer's machine; fill the cache from its Cargo.lock
        if: matrix.example == 'deps'
        run: (cd examples/deps && CARGO_NET_OFFLINE=false cargo +nightly-2026-09-26 fetch --locked)
      - name: Run
        env:
          EX: ${{ matrix.example }}
          ARGS: ${{ matrix.args }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p gate-logs
          rm -rf "examples/$EX/target/fv"
          # where the line's time goes (#1010): the busiest processes, every five minutes (threads,
          # CPU share since its start, resident kB, seconds since its start)
          (while sleep 300; do date -u +%T; ps -eo pid,nlwp,pcpu,rss,etimes,comm --sort=-pcpu | awk 'NR <= 9' || true; done) \
            > "gate-logs/$EX.ps" 2>&1 &
          sampler=$!
          start=$(date +%s)
          rc=0
          # shellcheck disable=SC2086
          PATH="$PWD/rust/target/release:$PATH" FV_ROOT="$PWD" /usr/bin/time -v -o "gate-logs/$EX.time" \
            examples/compare.sh "examples/$EX" $ARGS > "gate-logs/$EX.log" 2>&1 || rc=$?
          kill "$sampler" 2> /dev/null || true
          # keep cargo fv's own output: compare.sh writes it to a temporary directory it names
          logs=$(sed -n 's/.*(logs: \(.*\))$/\1/p' "gate-logs/$EX.log" | tail -n 1)
          if [[ -n "$logs" && -f "$logs/fv.log" ]]; then cp "$logs/fv.log" "gate-logs/$EX-cargo-fv.log"; fi
          # Green (scripts/gate-line-check.py): compare.sh's status 0, its SAME line, no missing
          # tool and no fallback in cargo fv's own log, every executable through the binary check
          # except exactly the issue-linked ones of scripts/gate-known-unverified.txt, the pinned
          # counts of scripts/gate-expected-counts.txt and, on the --lean-link lines, every link
          # by lean-ld. A job that only asked for SAME passed with "0 of 18 executable(s)
          # verified" and rust-lld links (#998, #1004); one that asked for N of N passes with a
          # smaller N. The counts (pinned and measured) and the known-unverified executables with
          # cargo fv's reasons go to the job summary.
          # --base: the pins of the base revision. A PR may raise a pin, not lower it: the pins
          # are read from the base revision too (LEARNINGS.md, "Untrusted input never widens the
          # policy"), or a change that loses functions turns green by editing the file. The base
          # revision is main's tip on a branch and, on main, the tip the push replaced (never
          # the tested commit). Without its copy (it cannot be fetched) the verdict is red; it
          # is empty while the base revision has no such file.
          base="$RUNNER_TEMP/expected-counts-base.txt"
          python3 scripts/gate-line-check.py base-pins "$base" --before "$BEFORE" || true
          lean_link=()
          if [[ " $ARGS " == *" --lean-link "* ]]; then lean_link=(--lean-link); fi
          ok=0
          verdict=$(python3 scripts/gate-line-check.py cargo-fv "$EX" "${lean_link[@]}" --base "$base" \
            --summary "$GITHUB_STEP_SUMMARY" "gate-logs/$EX.log" "gate-logs/$EX-cargo-fv.log") || ok=$?
          if [[ $rc == 0 && $ok != 0 ]]; then rc=1; fi
          echo "cargo fv${ARGS:+ $ARGS} $EX rc=$rc $(( $(date +%s) - start )) s: $verdict" | tee gate-logs/summary.txt
          grep -E 'Maximum resident|Elapsed' "gate-logs/$EX.time" || true
          tail -n 15 "gate-logs/$EX.log"
          # the functions that run Lean-compiled code without being verified (plain cargo fv only:
          # --verified keeps cg_clif's code for them), with lean-backend's reason (#1008)
          (cd "examples/$EX" && PATH="$GITHUB_WORKSPACE/rust/target/release:$PATH" FV_ROOT="$GITHUB_WORKSPACE" \
            cargo fv report --functions 2> /dev/null | grep -E '^    unverified ' | sort | uniq -c) \
            > "gate-logs/$EX-unverified.txt" || true
          if [[ -s "gate-logs/$EX-unverified.txt" ]]; then
            {
              echo "### Lean-compiled, unverified functions: $EX"
              echo
              echo '```'
              cat "gate-logs/$EX-unverified.txt"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Binary check details
        # cargo fv prints one line per executable; keep link-check's own report (its FAIL lines) for
        # every executable that is not verified: the known ones (#1003) and bigframe-unwind's too
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          EX: ${{ matrix.example }}
        run: |
          n=0
          while read -r exe; do
            n=$((n + 1))
            mode=$(sed -E 's#.*/target/fv/([^/]+)/.*#\1#' <<< "$exe")
            (cd "examples/$EX" && PATH="$GITHUB_WORKSPACE/rust/target/release:$PATH" FV_ROOT="$GITHUB_WORKSPACE" \
              cargo fv link-proof --exe "$exe" --out "$RUNNER_TEMP/bin-check-$n" --prune --mode "$mode") \
              > "gate-logs/$EX-binary-check-$n.log" 2>&1 || true
            echo "== $exe"
            grep -E -A1 '^ *FAIL ' "gate-logs/$EX-binary-check-$n.log" | head -n 40 || true
          done < <(sed -n -E 's/^cargo fv: binary ([^ ]+): not (verified|checked).*/\1/p' "gate-logs/$EX.log")
      # Crate parity, the second stock-parity metric (AGENTS.md), measured as #557 does: plain
      # `cargo fv test --keep-temps` (tests compiled, not run) and scripts/stock-crate-parity.py.
      # The daily digest (#46) reads the artifact. A measurement, not a gate line: it runs whether
      # or not the step above passed, and it never changes this job's result.
      - name: Crate parity
        if: ${{ !cancelled() && matrix.parity }}
        continue-on-error: true
        # a step timeout fails only this step; the job's 240 minutes stay for the gate line
        timeout-minutes: 60
        env:
          EX: ${{ matrix.example }}
        run: |
          set -o pipefail
          mkdir -p gate-logs crate-parity
          (cd "examples/$EX" && PATH="$GITHUB_WORKSPACE/rust/target/release:$PATH" FV_ROOT="$GITHUB_WORKSPACE" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/crate-parity" cargo fv test --keep-temps --no-run) \
            > "gate-logs/$EX-crate-parity.log" 2>&1
          python3 scripts/stock-crate-parity.py --json crate-parity/crate-parity.json \
            "$RUNNER_TEMP/crate-parity/fv/plain/tmp" | tee crate-parity/summary.txt
          { echo "### Crate parity: $EX"; echo; echo '```'; cat crate-parity/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && matrix.parity && hashFiles('crate-parity/crate-parity.json') != '' }}
        with:
          name: crate-parity-${{ matrix.example }}-${{ github.run_attempt }}
          path: crate-parity/crate-parity.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-cargo-fv-${{ matrix.example }}
          path: gate-logs
          retention-days: 14

  crate-proofs-fresh:
    # #994: the committed generated crate proofs are exactly what scripts/regen-crate-proofs.sh
    # writes from this tree. Their statements quote the compiler's output (CLIF, register
    # allocations, executable bytes), so a PR that changes generated code regenerates them in
    # the same PR (#709, #711). The crate-proofs job only builds the committed files: stale
    # proofs that still build passed it (#933 @aa4f16a55 lost its regeneration in a merge).
    # The script's output does not depend on the checkout or on $HOME (#984), so an empty diff
    # here means the files were regenerated from this tree, on any machine.
    name: crate-proofs freshness
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '16'
          stages: lake-full
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static llvm-18
          rustup toolchain install nightly-2026-09-26 --profile minimal \
            --component rustc-dev --target aarch64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl
      - name: Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            target/cg_clif
          key: full-gate-rust-cargo-fv-${{ hashFiles('rust/rust-toolchain.toml', 'rust/**/Cargo.lock', 'scripts/build-cg-clif.sh', 'scripts/patches/cg-clif-extnames.patch') }}
      - name: Build cg_clif and cargo fv
        run: |
          scripts/build-cg-clif.sh
          (cd rust && cargo build --release -p cargo-fv -p clif-data-export -p lean-regalloc)
          # the executables the script runs (restored from the assembled build), all required:
          # without link-check `cargo fv link-proof` writes no Lean file and exits 0
          lake build lean-backend clif-decode link-check dead-cleanup-generate 2>&1 | tail -n 1
          for t in lean-backend clif-decode link-check dead-cleanup-generate; do test -x ".lake/build/bin/$t"; done
      - name: Regenerate and compare
        run: |
          mkdir -p gate-logs
          start=$(date +%s)
          regen=0
          FV_ROOT="$PWD" /usr/bin/time -v -o gate-logs/regen.time scripts/regen-crate-proofs.sh \
            > gate-logs/regen.log 2>&1 || regen=$?
          # every difference from the committed tree: changed, deleted and new files
          git add --intent-to-add -- crate-proofs
          git diff --stat=200 -- crate-proofs > gate-logs/changed.txt
          n=$(git diff --name-only -- crate-proofs | wc -l)
          rc=0
          if [[ $regen != 0 || $n != 0 ]]; then rc=1; fi
          if (( n )); then
            git diff --binary -- crate-proofs > gate-logs/crate-proofs-regen.patch
            {
              echo "### crate-proofs freshness: $n file(s) differ from scripts/regen-crate-proofs.sh's output"
              echo
              echo "The committed generated crate proofs are not the ones this tree generates. Rerun \`FV_ROOT=\$PWD scripts/regen-crate-proofs.sh\` and commit the result (the script's output does not depend on the machine), or apply \`crate-proofs-regen.patch\` from the artifact \`gate-crate-proofs-fresh\`, and check that \`crate-proofs\` builds."
              echo
              echo '```'
              tail -n 40 gate-logs/changed.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "crate-proofs freshness rc=$rc $(( $(date +%s) - start )) s: regen-crate-proofs.sh exit $regen, $n file(s) differ from the committed crate-proofs" | tee gate-logs/summary.txt
          grep -E 'Maximum resident|Elapsed' gate-logs/regen.time || true
          tail -n 15 gate-logs/regen.log
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-crate-proofs-fresh
          path: gate-logs
          retention-days: 14

  float-spec:
    # FV/Float proved equal to FloatLib's IEEE 754 model, and the same FV/Float definitions under
    # both toolchains (docs/contracts/float.md, "Trust"; scripts/float-spec.sh). A separate Lake
    # package on its own toolchain (float-spec/lean-toolchain) that reads only FV/Float's five
    # core-only modules, so it needs neither the baseline build nor the assembled one.
    name: float-spec
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fv-lean
        with:
          swap-gb: '16'
      - name: elan (float-spec's toolchain)
        env:
          ELAN_ARCHIVE: ${{ runner.temp }}/elan.tar.gz
        run: |
          # scripts/float-spec.sh calls `lake` in the root package (lean-toolchain) and in
          # float-spec/ (its own lean-toolchain): elan picks the toolchain per directory
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$ELAN_ARCHIVE"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $ELAN_ARCHIVE" | sha256sum --check
          tar -xzf "$ELAN_ARCHIVE" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          # the root package keeps the pinned toolchain every other job uses
          "$HOME/.elan/bin/elan" toolchain link "$(cat lean-toolchain)" "$(dirname "$LEAN_BIN_DIR")"
      - name: Run
        run: |
          mkdir -p gate-logs
          export PATH="$HOME/.elan/bin:$PATH"
          # Mathlib's oleans (~1 GB download, ~7.5 GB unpacked) and FloatLib's build go on /
          if (( $(df --output=avail -B1G / | tail -n 1) < 25 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          (cd float-spec && lake --version) && lake --version
          start=$(date +%s)
          rc=0; scripts/float-spec.sh > gate-logs/float-spec.log 2>&1 || rc=$?
          echo "float-spec rc=$rc $(( $(date +%s) - start )) s: $(grep -E '^(ok|FAIL)|axiom audit|build failed|\(FAIL\)' gate-logs/float-spec.log | tr '\n' ' ')" | tee gate-logs/summary.txt
          tail -n 15 gate-logs/float-spec.log
          df -h /
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-float-spec
          path: gate-logs
          retention-days: 14

  retry:
    name: Retry after a lost shard
    needs: [plan, assemble]
    # once per push: the retry is a workflow_dispatch run and never retries itself
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.assemble.result != 'skipped' && needs.assemble.outputs.complete != '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start one more run if a shard died before building
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          # A shard whose Build step did not fail lost its runner or failed in setup (a full disk,
          # a download); a second run plans only what this run's partial lake-full lacks. Modules
          # that failed to build need a fix, not a retry.
          lost=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select((.name | startswith("Build wave")) and .conclusion == "failure")
                  | select([.steps[] | select(.name == "Build" and .conclusion == "failure")] | length == 0)
                  | .name')
          if [[ -z $lost ]]; then echo "no lost shard"; exit 0; fi
          printf 'lost shards:\n%s\n' "$lost"
          # a newer push already waits: its run builds on this partial lake-full anyway
          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/full-gate.yml/runs?branch=main&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\")] | length")
          if (( pending )); then echo "a newer run is pending; no retry"; exit 0; fi
          gh workflow run full-gate.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "started a retry run on main"

  report:
    name: Report
    needs: [plan, wave1, wave2, wave3, assemble, audit, crate-proofs, crate-proofs-fresh, e2e, runtime, cargo-fv, float-spec, unused-imports]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-*
          path: report
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-logs-*
          path: report
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ci-plan
          path: report/ci-plan
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
          # converts runner seconds to the timing table's units for the drift check (as in Plan)
          TIME_SCALE: ${{ vars.FULL_GATE_TIME_SCALE || '2.0' }}
        run: python3 .github/scripts/full-gate-report.py report > report.md && cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lake-module-peaks
          path: report/lake-module-peaks.tsv
          retention-days: 14
          if-no-files-found: ignore
      - name: Post to the continuous-gate issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$FULL_GATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file report.md
      - name: Fail on red
        run: grep -q '^\*\*Result. GREEN' report.md
