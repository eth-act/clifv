{
  "name": "Stock proof cache handoff",
  "run-name": "StockCmpWithFlags exact-source cache 5f4f9bf6",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "actions": "read",
    "contents": "read"
  },
  "concurrency": {
    "group": "stock-proof-cache-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "cache": {
      "name": "Unchanged StockCmpWithFlags, standard CI swap lane",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "uses": "./.github/actions/fv-lean",
          "with": {
            "swap-gb": "24"
          }
        },
        {
          "name": "Restore matching main wave1 outputs",
          "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
          "with": {
            "pattern": "stage-w1-*",
            "path": "${{ runner.temp }}/stock-input-stages",
            "run-id": "39219555558",
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Unstage through Lake input keys",
          "run": "python3 - <<'PYRESTORE'\nfrom pathlib import Path\nimport os,subprocess\nfor p in sorted((Path(os.environ['RUNNER_TEMP'])/'stock-input-stages').rglob('outputs.jsonl')):\n    subprocess.run(['scripts/memcap.sh','lake','cache','unstage',str(p.parent)],check=True)\nPYRESTORE\n"
        },
        {
          "name": "Build and stage unchanged proof",
          "run": "mkdir -p \"$RUNNER_TEMP/stock-heavy\"\ngit diff --exit-code HEAD^ HEAD -- FV FVTest lakefile.toml lean-toolchain\n{ git rev-parse HEAD HEAD^; lean --version; sha256sum FV/Backend/Proof/StockCmpWithFlags.lean; } | tee \"$RUNNER_TEMP/stock-heavy/source.txt\"\npython3 scripts/lake-serial-build.py --out \"$RUNNER_TEMP/stock-heavy/sched\" --record \"$RUNNER_TEMP/stock-heavy/peaks.tsv\" --budget 15G --heavy 12G --heavy-avail 0 --pause-avail 1G --max-jobs 1 --margin 1.0 --max-cap 48G --retry-failed FV.Backend.Proof.StockCmpWithFlags\nscripts/memcap.sh lake build --no-build FV.Backend.Proof.StockCmpWithFlags -o \"$RUNNER_TEMP/stock-heavy/outputs.jsonl\"\nscripts/memcap.sh lake cache stage \"$RUNNER_TEMP/stock-heavy/outputs.jsonl\" \"$RUNNER_TEMP/stock-heavy/stage\"\n"
        },
        {
          "name": "Publish checked Lake outputs",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "stock-cmp-heavy-cache",
            "path": "${{ runner.temp }}/stock-heavy/stage",
            "compression-level": 0,
            "retention-days": 7
          }
        },
        {
          "name": "Publish diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "stock-cmp-heavy-evidence",
            "path": "${{ runner.temp }}/stock-heavy",
            "retention-days": 14,
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
