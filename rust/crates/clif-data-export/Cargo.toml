[package]
name = "clif-data-export"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Writes the data objects of a cg_clif object file (bytes, ABS64 relocations) as `; data:` directives"

[dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
