[package]
name = "clif-oracle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runs `; run:` lines of .clif files on the Cranelift interpreter and prints JSON (M0 oracle)"

[[bin]]
name = "clif-oracle"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { workspace = true }
cranelift-reader = { workspace = true }
cranelift-interpreter = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
smallvec = "1"
