[package]
name = "flat-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Map runtime externs for compiled DSL code (docs/contracts/compile.md §4), no_std, arena-allocated"

[lib]
path = "src/lib.rs"
# The aarch64 static library is built with `cargo rustc --crate-type staticlib -- -C panic=abort`
# (see src/lib.rs); declaring `staticlib` here would make every host workspace build link a
# no_std staticlib with the default unwinding panic strategy, which rustc rejects.
crate-type = ["rlib"]
