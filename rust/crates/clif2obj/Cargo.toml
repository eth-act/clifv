[package]
name = "clif2obj"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Compiles .clif to an object file with verification-friendly settings and dumps per-function code, relocations and traps (PLAN.md Appendix A)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clif2obj"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { workspace = true }
cranelift-reader = { workspace = true }
cranelift-module = { workspace = true }
cranelift-object = { workspace = true }
target-lexicon = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
