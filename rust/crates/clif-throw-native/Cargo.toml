[package]
name = "clif-throw-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runs `; run:` lines of .clif files natively on the host with Cranelift's JIT and its `__cranelift_throw` exception hostcall; prints clif-oracle's JSON (oracle of Clif.runX, S10b)"

[[bin]]
name = "clif-throw-native"
path = "src/main.rs"

[dependencies]
clif-runlines = { path = "../clif-runlines" }
cranelift-codegen = { workspace = true }
cranelift-reader = { workspace = true }
cranelift-module = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift = "=0.136.1"
cranelift-control = "=0.136.1"
cranelift-native = "=0.136.1"
cranelift-jit = { version = "=0.136.1", features = ["wasmtime-unwinder"] }
wasmtime-unwinder = { package = "wasmtime-internal-unwinder", version = "=49.0.1", features = ["cranelift"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
libm = "0.2"
