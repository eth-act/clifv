[package]
name = "clif-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runs `; run:` lines of .clif files natively (Cranelift aarch64 + qemu-aarch64-static); JSON output in the clif-oracle schema"

[[bin]]
name = "clif-native"
path = "src/main.rs"

[dependencies]
clif2obj = { path = "../clif2obj" }
clif-runlines = { path = "../clif-runlines" }
cranelift-codegen = { workspace = true }
cranelift-reader = { workspace = true }
cranelift-frontend = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
