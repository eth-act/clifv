name = "fv"
defaultTargets = ["FV"]
# Build-only (not part of the module trace, so no rebuild): every linter warning is stored in
# the module's .olean together with the absolute path of the source file (lintLogExt, Lean
# 4.34), so a module with warnings gets different .olean bytes in every worktree and all its
# dependents then miss the shared Lake cache. The editor still shows these warnings
# (LEARNINGS.md, "Some .oleans are not deterministic").
weakLeanArgs = ["-Dlinter.unusedSimpArgs=false", "-Dlinter.unusedVariables=false",
  "-Dlinter.unnecessarySimpa=false", "-Dlinter.unusedSectionVars=false", "-Dlinter.defProp=false",
  "-Dlinter.constructorNameAsVariable=false"]

[[lean_lib]]
name = "FV"
globs = ["FV.+"]

[[lean_lib]]
name = "FVTest"
globs = ["FVTest.+"]

# lean_exe targets: each component appends its own [[lean_exe]] section below.
# Re-read this file right before editing it; other components edit it concurrently.

