name = "fv"
defaultTargets = ["FV"]

[[lean_lib]]
name = "FV"
globs = ["FV.+"]

[[lean_lib]]
name = "FVTest"
globs = ["FVTest.+"]

# lean_exe targets: each component appends its own [[lean_exe]] section below.
# Re-read this file right before editing it; other components edit it concurrently.

[[lean_exe]]
name = "arm-cosim"
root = "FVTest.Arm.Cosim.Main"

[[lean_exe]]
name = "clif-filetest"
root = "FVTest.Clif.Filetest"

[[lean_lib]]
name = "Corpus"
srcDir = "corpus/dsl"
globs = ["Corpus.+"]

[[lean_exe]]
name = "emit"
root = "FVTest.Compile.EmitMain"

[[lean_exe]]
name = "compile-diff"
root = "FVTest.Compile.Diff"

[[lean_exe]]
name = "lean-backend"
root = "FVTest.Backend.Main"

[[lean_exe]]
name = "lean-backend-armrun"
root = "FVTest.Backend.ArmRun"

[[lean_exe]]
name = "lean-backend-encode-test"
root = "FVTest.Backend.Encode.Test"

[[lean_exe]]
name = "lean-backend-regalloc-test"
root = "FVTest.Backend.Regalloc.Test"
