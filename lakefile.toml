name = "fv"
defaultTargets = ["FV"]

[[lean_lib]]
name = "FV"
globs = ["FV.+"]

[[lean_lib]]
name = "FVTest"
globs = ["FVTest.+"]

# lean_exe targets: each component appends its own [[lean_exe]] section below.
# Re-read this file right before editing it; other components edit it concurrently.

[[lean_exe]]
name = "arm-cosim"
root = "FVTest.Arm.Cosim.Main"

[[lean_exe]]
name = "clif-filetest"
root = "FVTest.Clif.Filetest"

# Crate-level instances (`cargo fv link-proof` / `lake exe link-check --lean`): their
# `native_decide` proofs run FV's checker as compiled code, loaded from the shared library of
# `FV.E2E.LinkCheck` (and of the modules it imports).
[[lean_lib]]
name = "Crates"
globs = ["Crates.+"]

[[lean_lib]]
name = "Corpus"
srcDir = "corpus/dsl"
globs = ["Corpus.+"]

[[lean_exe]]
name = "emit"
root = "FVTest.Compile.EmitMain"

[[lean_exe]]
name = "compile-diff"
root = "FVTest.Compile.Diff"

[[lean_exe]]
name = "lean-backend"
root = "FVTest.Backend.Main"

[[lean_exe]]
name = "lean-backend-armrun"
root = "FVTest.Backend.ArmRun"

[[lean_exe]]
name = "lean-backend-encode-test"
root = "FVTest.Backend.Encode.Test"

[[lean_exe]]
name = "lean-backend-regalloc-test"
root = "FVTest.Backend.Regalloc.Test"

[[lean_exe]]
name = "lean-e2e-check"
root = "FVTest.E2E.Check"

[[lean_exe]]
name = "clif-opt"
root = "FVTest.Opt.Main"

[[lean_exe]]
name = "opt-difftest"
root = "FVTest.Opt.DiffTest"

[[lean_exe]]
name = "opt-fuzz"
root = "FVTest.Opt.Fuzz"

[[lean_exe]]
name = "link-check"
root = "FVTest.E2E.LinkCheckMain"
